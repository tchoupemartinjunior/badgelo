<div class="space-y-4 md:space-y-6">
    <div class="hidden border-b border-gray-200 pb-4 md:block">
        <h2 class="text-lg font-semibold text-purple-700">{{ 'LOGO_EDITOR.TITLE' | translate }}</h2>
    </div>

    <!-- Logo importé -->
    <div class="flex flex-col gap-3">
        @if(logo().url) {
        <div class="flex items-center gap-3 rounded-xl border-2 border-dashed border-violet-300 bg-purple-50 p-3">
            <div class="flex size-16 flex-none items-center justify-center rounded-lg border border-gray-200"
                [style.background]="checkerboard">
                <img [src]="logo().url" alt="" class="max-h-14 max-w-14 object-contain" />
            </div>
            <div class="min-w-0">
                <p class="truncate text-sm font-semibold text-gray-800">{{ logo().name }}</p>
                <p class="text-xs text-gray-600">{{ 'LOGO_EDITOR.HINT' | translate }}</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button type="button" (click)="fileInput.click()"
                class="min-h-11 rounded-lg border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 hover:cursor-pointer hover:border-purple-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-700">
                {{ 'LOGO_EDITOR.REPLACE' | translate }}
            </button>
            <button type="button" (click)="editorStateService.removeLogo()"
                class="min-h-11 rounded-lg border border-red-200 bg-white px-4 text-sm font-medium text-red-700 hover:cursor-pointer hover:border-red-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700">
                {{ 'LOGO_EDITOR.REMOVE' | translate }}
            </button>
        </div>
        } @else {
        <button type="button" (click)="fileInput.click()"
            class="flex flex-col items-center gap-2 rounded-xl border-2 border-dashed border-violet-400 bg-purple-50 px-4 py-8 text-center hover:cursor-pointer hover:border-purple-600 hover:bg-purple-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-700">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" class="text-violet-700" aria-hidden="true">
                <path d="M12 16V4" />
                <path d="M7 9l5-5 5 5" />
                <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <span class="text-sm font-semibold text-gray-800">{{ 'LOGO_EDITOR.UPLOAD' | translate }}</span>
            <span class="text-xs text-gray-600">{{ 'LOGO_EDITOR.HINT' | translate }}</span>
        </button>
        }
        <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)"
            [attr.aria-label]="'LOGO_EDITOR.UPLOAD' | translate" />
    </div>

    @if(logo().url) {
    <!-- Position -->
    <div class="flex flex-col gap-2">
        <span id="logo-position-label" class="text-sm font-medium text-gray-700">{{ 'LOGO_EDITOR.POSITION_LABEL' |
            translate }}</span>
        <div class="grid w-fit grid-cols-3 gap-1.5" role="group" aria-labelledby="logo-position-label">
            @for(position of positions; track position.value) {
            <button type="button" (click)="editorStateService.setLogoPosition(position.value)"
                [attr.aria-pressed]="logo().position === position.value"
                [attr.aria-label]="position.labelKey | translate" [attr.title]="position.labelKey | translate"
                [class]="logo().position === position.value ? 'border-purple-700 bg-purple-700' : 'border-gray-300 bg-white hover:border-purple-500'"
                class="flex size-11 items-center justify-center rounded-lg border hover:cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-700">
                <span class="size-2.5 rounded-full"
                    [class]="logo().position === position.value ? 'bg-white' : 'bg-gray-400'"
                    aria-hidden="true"></span>
            </button>
            }
        </div>
        <p class="text-xs text-gray-600">{{ 'LOGO_EDITOR.BOTTOM_HINT' | translate }}</p>
    </div>

    <bdge-slider [value]="logo().size" [min]="sizeMin" [max]="sizeMax"
        (valueChange)="editorStateService.setLogoSize($event)"
        [label]="'LOGO_EDITOR.SIZE_LABEL' | translate"></bdge-slider>
    <bdge-slider [value]="logo().opacity" [min]="opacityMin" [max]="opacityMax"
        (valueChange)="editorStateService.setLogoOpacity($event)"
        [label]="'LOGO_EDITOR.OPACITY_LABEL' | translate"></bdge-slider>
    }

    <!-- Filigrane -->
    <div class="flex items-start gap-3 border-t border-gray-200 pt-5">
        <input id="logo-watermark" type="checkbox" class="mt-0.5 size-5 flex-none accent-purple-700"
            [checked]="watermark()" (change)="onWatermarkChange($event)" />
        <label for="logo-watermark" class="flex flex-col gap-0.5">
            <span class="text-sm font-semibold text-gray-800">{{ 'LOGO_EDITOR.WATERMARK_LABEL' | translate }}</span>
            <span class="text-xs text-gray-600">{{ 'LOGO_EDITOR.WATERMARK_DESC' | translate }}</span>
        </label>
    </div>
</div>
